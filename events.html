</head>

<!-- ================= PAGE HEADER ================= -->

<section class="page-header">

    <div class="container">

        <h1>
            College Events
        </h1>

        <p>
            Explore and register for college events.
        </p>

    </div>

</section>



<!-- ================= EVENT SUMMARY ================= -->

<section class="py-4">

    <div class="container">

        <div class="row g-4">


            <!-- TOTAL EVENTS -->

            <div class="col-md-6">

                <div class="summary-card">

                    <i class="bi bi-calendar-event summary-icon"></i>

                    <h5>
                        Total Events
                    </h5>

                    <h2 id="eventCount">
                        0
                    </h2>

                </div>

            </div>



            <!-- REGISTERED EVENTS -->

            <div class="col-md-6">

                <div class="summary-card">

                    <i class="bi bi-person-check summary-icon"></i>

                    <h5>
                        My Registrations
                    </h5>

                    <h2 id="registeredCount">
                        0
                    </h2>

                </div>

            </div>

        </div>

    </div>

</section>



<!-- ================= SEARCH ================= -->

<section class="pb-4">

    <div class="container">

        <input
            type="text"
            id="eventSearch"
            class="form-control"
            placeholder="Search events..."
            onkeyup="searchEvents()">

    </div>

</section>



<!-- ================= EVENTS ================= -->

<section class="pb-5">

    <div class="container">

        <div class="row g-4"
             id="eventList">

        </div>

    </div>

</section>



<!-- ================================================= -->
<!--              REGISTRATION MODAL                  -->
<!-- ================================================= -->

<div class="modal fade"
     id="registrationModal"
     tabindex="-1"
     aria-hidden="true">


    <div class="modal-dialog modal-dialog-centered">


        <div class="modal-content">


            <!-- MODAL HEADER -->

            <div class="modal-header">

                <h5 class="modal-title">

                    <i class="bi bi-person-plus-fill text-primary"></i>

                    Event Registration

                </h5>


                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">

                </button>

            </div>



            <!-- MODAL BODY -->

            <div class="modal-body">


                <form id="registrationForm">


                    <!-- EVENT -->

                    <div class="mb-3">

                        <label class="form-label">
                            Selected Event
                        </label>

                        <input
                            type="text"
                            id="selectedEvent"
                            class="form-control"
                            readonly>

                    </div>



                    <!-- NAME -->

                    <div class="mb-3">

                        <label class="form-label">
                            Student Name
                        </label>

                        <input
                            type="text"
                            id="studentName"
                            class="form-control"
                            placeholder="Enter your name"
                            required>

                    </div>



                    <!-- STUDENT ID -->

                    <div class="mb-3">

                        <label class="form-label">
                            Student ID
                        </label>

                        <input
                            type="text"
                            id="studentId"
                            class="form-control"
                            placeholder="Enter student ID"
                            required>

                    </div>



                    <!-- DEPARTMENT -->

                    <div class="mb-3">

                        <label class="form-label">
                            Department
                        </label>


                        <select
                            id="department"
                            class="form-select"
                            required>

                            <option value="">
                                Select Department
                            </option>

                            <option value="IT">
                                Information Technology
                            </option>

                            <option value="CS">
                                Computer Science
                            </option>

                            <option value="BCA">
                                Computer Applications
                            </option>

                            <option value="BBA">
                                Business Administration
                            </option>

                            <option value="Commerce">
                                Commerce
                            </option>

                        </select>

                    </div>



                    <!-- YEAR -->

                    <div class="mb-3">

                        <label class="form-label">
                            Year
                        </label>


                        <select
                            id="year"
                            class="form-select"
                            required>

                            <option value="">
                                Select Year
                            </option>

                            <option value="First Year">
                                First Year
                            </option>

                            <option value="Second Year">
                                Second Year
                            </option>

                            <option value="Third Year">
                                Third Year
                            </option>

                        </select>

                    </div>



                    <!-- EMAIL -->

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>


                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            placeholder="Enter email"
                            required>

                    </div>



                    <!-- PHONE -->

                    <div class="mb-3">

                        <label class="form-label">
                            Phone Number
                        </label>


                        <input
                            type="tel"
                            id="phone"
                            class="form-control"
                            placeholder="Enter phone number"
                            pattern="[0-9]{10}"
                            maxlength="10"
                            required>

                    </div>



                    <!-- SUBMIT -->

                    <button
                        type="submit"
                        class="btn btn-primary w-100">

                        <i class="bi bi-check-circle"></i>

                        Submit Registration

                    </button>


                </form>

            </div>

        </div>

    </div>

</div>



<!-- ================= FOOTER ================= -->

<footer class="bg-dark text-white text-center py-4">

    <p class="mb-0">

        © 2026 CampusConnect |
        Smart College Life Portal

<!-- ================= BOOTSTRAP JS ================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>



<!-- ================= JAVASCRIPT ================= -->

<script>


// ========================================
// EVENT DATA
// ========================================


let events = [

    {
        name: "Web Development Workshop",
        date: "September 12, 2026",
        place: "Computer Lab",
        type: "Workshop",
        registered: false
    },


    {
        name: "Tech Symposium 2026",
        date: "September 18, 2026",
        place: "College Auditorium",
        type: "Symposium",
        registered: false
    },


    {
        name: "Coding Competition",
        date: "September 22, 2026",
        place: "IT Lab",
        type: "Competition",
        registered: false
    },


    {
        name: "Photography Contest",
        date: "September 25, 2026",
        place: "Seminar Hall",
        type: "Contest",
        registered: false
    },


    {
        name: "Career Guidance Seminar",
        date: "September 28, 2026",
        place: "Seminar Hall",
        type: "Seminar",
        registered: false
    },


    {
        name: "Cultural Fest 2026",
        date: "October 2, 2026",
        place: "College Ground",
        type: "Cultural",
        registered: false
    }

];



// ========================================
// DISPLAY EVENTS
// ========================================


function displayEvents(data = events) {


    let eventList =
        document.getElementById("eventList");


    eventList.innerHTML = "";



    if (data.length === 0) {


        eventList.innerHTML = `

            <div class="col-12">

                <div class="alert alert-info text-center">

                    <i class="bi bi-search"></i>

                    No events found.

                </div>

            </div>

        `;


        return;

    }



    data.forEach(function(event) {


        // Find original event index

        let originalIndex =
            events.indexOf(event);



        eventList.innerHTML += `


            <div class="col-md-6 col-lg-4">


                <div class="card event-card h-100 shadow-sm">


                    <div class="card-body">


                        <span class="badge bg-primary mb-3">

                            ${event.type}

                        </span>



                        <h4>

                            ${event.name}

                        </h4>



                        <p class="text-muted mb-2">

                            <i class="bi bi-calendar"></i>

                            ${event.date}

                        </p>



                        <p class="text-muted">

                            <i class="bi bi-geo-alt"></i>

                            ${event.place}

                        </p>



                        <hr>



                        <button

                            onclick="registerEvent(${originalIndex})"

                            class="btn ${
                                event.registered
                                ? "btn-success"
                                : "btn-primary"
                            } w-100">


                            ${
                                event.registered

                                ? `

                                    <i class="bi bi-check-circle"></i>

                                    Registered

                                  `

                                : `

                                    <i class="bi bi-person-plus"></i>

                                    Register Now

                                  `
                            }


                        </button>


                    </div>

                </div>

            </div>


        `;

    });



    updateEventCount();

}



// ========================================
// REGISTER EVENT
// ========================================


function registerEvent(index) {


    let event = events[index];



    // Already registered

    if (event.registered === true) {

        alert(
            "You are already registered for this event!"
        );

        return;

    }



    // Show selected event

    document.getElementById("selectedEvent").value =
        event.name;



    // Clear old form values

    document.getElementById("studentName").value = "";

    document.getElementById("studentId").value = "";

    document.getElementById("department").value = "";

    document.getElementById("year").value = "";

    document.getElementById("email").value = "";

    document.getElementById("phone").value = "";



    // Store selected event index

    document.getElementById("registrationForm")
        .dataset.eventIndex = index;



    // Create Bootstrap modal

    let modalElement =
        document.getElementById("registrationModal");


    let modal =
        new bootstrap.Modal(modalElement);


    // Show modal

    modal.show();

}



// ========================================
// FORM SUBMIT
// ========================================


document.getElementById("registrationForm")
.addEventListener("submit", function(event) {


    // Stop page refresh

    event.preventDefault();



    // Get event index

    let index =
        this.dataset.eventIndex;



    // Get form values

    let studentName =
        document.getElementById("studentName").value;

    let studentId =
        document.getElementById("studentId").value;

    let department =
        document.getElementById("department").value;

    let year =
        document.getElementById("year").value;

    let email =
        document.getElementById("email").value;

    let phone =
        document.getElementById("phone").value;



    // Change registration status

    events[index].registered = true;



    // Show success message

    alert(

        "Registration Successful!\n\n" +

        "Student: " + studentName + "\n" +

        "Event: " + events[index].name

    );



    // Close modal

    let modalElement =
        document.getElementById("registrationModal");


    let modal =
        bootstrap.Modal.getInstance(modalElement);


    modal.hide();



    // Refresh events

    displayEvents();



});



// ========================================
// UPDATE EVENT COUNT
// ========================================


function updateEventCount() {


    // Total events

    document.getElementById("eventCount").innerText =
        events.length;



    // Registered events

    let registered =
        events.filter(function(event) {

            return event.registered === true;

        }).length;



    document.getElementById("registeredCount").innerText =
        registered;

}



// ========================================
// SEARCH EVENTS
// ========================================


function searchEvents() {


    let searchText =

        document
        .getElementById("eventSearch")
        .value
        .toLowerCase();



    let result =

        events.filter(function(event) {


            return (

                event.name
                .toLowerCase()
                .includes(searchText)


                ||

                event.type
                .toLowerCase()
                .includes(searchText)


                ||

                event.place
                .toLowerCase()
                .includes(searchText)

            );


        });



    displayEvents(result);

}



// ========================================
// INITIAL DISPLAY
// ========================================


displayEvents();


</script>


</body>

</html>
