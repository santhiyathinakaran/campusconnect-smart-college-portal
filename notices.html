<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notices - CampusConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold text-primary"
           href="index.html">

            <i class="bi bi-mortarboard-fill"></i>
            CampusConnect

        </a>

        <a href="index.html"
           class="btn btn-outline-primary">
            Home
        </a>

    </div>

</nav>


<section class="page-header">

    <div class="container">

        <h1>Notice Board</h1>

        <p>Latest college announcements and updates.</p>

    </div>

</section>


<section class="py-5">

    <div class="container">

        <input id="noticeSearch"
               onkeyup="searchNotices()"
               class="form-control mb-4"
               placeholder="Search notices...">


        <div id="noticeList"></div>

    </div>

</section>


<footer class="bg-dark text-white text-center py-4">

    <p class="mb-0">
        © 2026 CampusConnect
    </p>

</footer>


<script>

let notices = [

    {
        title: "Internal Examination Schedule",
        date: "September 10, 2026",
        category: "Exam",
        description:
        "Internal examination schedule has been published."
    },

    {
        title: "Web Development Workshop",
        date: "September 12, 2026",
        category: "Event",
        description:
        "Students can register for the upcoming workshop."
    },

    {
        title: "College Holiday Announcement",
        date: "September 15, 2026",
        category: "General",
        description:
        "College will remain closed on the announced holiday."
    },

    {
        title: "Assignment Submission",
        date: "September 20, 2026",
        category: "Academic",
        description:
        "Students should submit pending assignments before the deadline."
    }

];


function displayNotices(data = notices) {

    let list =
        document.getElementById("noticeList");

    list.innerHTML = "";


    data.forEach(function(notice) {

        list.innerHTML += `

            <div class="card notice-card shadow-sm mb-3">

                <div class="card-body">

                    <span class="badge bg-primary mb-2">
                        ${notice.category}
                    </span>

                    <h4>${notice.title}</h4>

                    <p class="text-muted">
                        ${notice.date}
                    </p>

                    <p>
                        ${notice.description}
                    </p>

                </div>

            </div>

        `;

    });

}


function searchNotices() {

    let text =
        document
        .getElementById("noticeSearch")
        .value
        .toLowerCase();


    let result =
        notices.filter(function(notice) {

            return notice.title
                .toLowerCase()
                .includes(text);

        });


    displayNotices(result);

}


displayNotices();

</script>

</body>
</html>
