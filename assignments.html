<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Assignments - CampusConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold text-primary"
           href="index.html">

            <i class="bi bi-mortarboard-fill"></i>
            CampusConnect

        </a>

        <a href="index.html"
           class="btn btn-outline-primary">
            Home
        </a>

    </div>

</nav>


<section class="page-header">

    <div class="container">

        <h1>My Assignments</h1>

        <p id="todayDate"></p>

    </div>

</section>


<section class="py-4">

    <div class="container">

        <div class="row g-4">

            <div class="col-md-4">

                <div class="summary-card">

                    <i class="bi bi-journal-text summary-icon"></i>

                    <h5>Total</h5>

                    <h2 id="totalCount">0</h2>

                </div>

            </div>


            <div class="col-md-4">

                <div class="summary-card">

                    <i class="bi bi-hourglass-split summary-icon"></i>

                    <h5>Pending</h5>

                    <h2 id="pendingCount">0</h2>

                </div>

            </div>


            <div class="col-md-4">

                <div class="summary-card">

                    <i class="bi bi-check-circle summary-icon"></i>

                    <h5>Completed</h5>

                    <h2 id="completedCount">0</h2>

                </div>

            </div>

        </div>

    </div>

</section>


<section class="pb-4">

    <div class="container">

        <div class="card p-4 shadow-sm">

            <h4>Add Assignment</h4>

            <div class="row g-3 mt-1">

                <div class="col-md-5">

                    <input id="assignmentName"
                           class="form-control"
                           placeholder="Assignment name">

                </div>

                <div class="col-md-4">

                    <input id="assignmentSubject"
                           class="form-control"
                           placeholder="Subject">

                </div>

                <div class="col-md-3">

                    <button onclick="addAssignment()"
                            class="btn btn-primary w-100">

                        Add Assignment

                    </button>

                </div>

            </div>

        </div>

    </div>

</section>


<section class="pb-4">

    <div class="container">

        <input id="searchAssignment"
               onkeyup="searchAssignments()"
               class="form-control"
               placeholder="Search assignment...">

    </div>

</section>


<section class="pb-5">

    <div class="container">

        <h3 class="mb-4">Assignments</h3>

        <div id="assignmentList"></div>

    </div>

</section>


<footer class="bg-dark text-white text-center py-4">

    <p class="mb-0">
        © 2026 CampusConnect
    </p>

</footer>


<script>

let assignments = [

    {
        name: "JavaScript Functions",
        subject: "Web Development",
        status: "Pending"
    },

    {
        name: "SQL Query Practice",
        subject: "Database",
        status: "Pending"
    },

    {
        name: "Responsive Web Page",
        subject: "Web Designing",
        status: "Completed"
    },

    {
        name: "Python Dictionary",
        subject: "Python",
        status: "Completed"
    }

];


function displayAssignments(data = assignments) {

    let list =
        document.getElementById("assignmentList");

    list.innerHTML = "";


    data.forEach(function(item, index) {

        let button = "";

        if (item.status === "Pending") {

            button = `
                <button
                    onclick="completeAssignment(${index})"
                    class="btn btn-success btn-sm">
                    Complete
                </button>
            `;

        }


        list.innerHTML += `

            <div class="card assignment-card shadow-sm mb-3">

                <div class="card-body">

                    <div class="d-flex
                                justify-content-between
                                align-items-center">

                        <div>

                            <h5>${item.name}</h5>

                            <span class="badge bg-primary">
                                ${item.subject}
                            </span>

                        </div>

                        <div>

                            <span class="badge
                                ${item.status === "Completed"
                                ? "bg-success"
                                : "bg-warning text-dark"}">

                                ${item.status}

                            </span>

                            ${button}

                        </div>

                    </div>

                </div>

            </div>

        `;

    });


    updateCounts();

}


function addAssignment() {

    let name =
        document.getElementById("assignmentName").value;

    let subject =
        document.getElementById("assignmentSubject").value;


    if (name === "" || subject === "") {

        alert("Please enter all details.");

        return;

    }


    assignments.push({

        name: name,
        subject: subject,
        status: "Pending"

    });


    document.getElementById("assignmentName").value = "";

    document.getElementById("assignmentSubject").value = "";


    displayAssignments();

}


function completeAssignment(index) {

    assignments[index].status = "Completed";

    displayAssignments();

}


function updateCounts() {

    let total = assignments.length;

    let pending =
        assignments.filter(function(item) {

            return item.status === "Pending";

        }).length;


    let completed =
        assignments.filter(function(item) {

            return item.status === "Completed";

        }).length;


    document.getElementById("totalCount").innerText = total;

    document.getElementById("pendingCount").innerText = pending;

    document.getElementById("completedCount").innerText =
        completed;

}


function searchAssignments() {

    let text =
        document
        .getElementById("searchAssignment")
        .value
        .toLowerCase();


    let result =
        assignments.filter(function(item) {

            return item.name
                .toLowerCase()
                .includes(text);

        });


    displayAssignments(result);

}


document.getElementById("todayDate").innerText =
    new Date().toLocaleDateString("en-IN", {

        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"

    });


displayAssignments();

</script>

</body>
</html>
