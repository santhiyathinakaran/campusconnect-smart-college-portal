<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Progress - CampusConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar navbar-light bg-white shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold text-primary"
           href="index.html">
            CampusConnect
        </a>

        <a href="index.html"
           class="btn btn-outline-primary">
            Home
        </a>

    </div>

</nav>


<section class="page-header">

    <div class="container">

        <h1>Academic Progress</h1>

        <p>Track your subject-wise progress.</p>

    </div>

</section>


<section class="py-5">

    <div class="container">

        <div class="card shadow-sm p-4">

            <h4>Overall Progress</h4>

            <div class="progress my-3"
                 style="height: 25px;">

                <div class="progress-bar"
                     style="width: 78%;">

                    78%

                </div>

            </div>


            <hr>


            <h5>JavaScript</h5>

            <div class="progress mb-4">

                <div class="progress-bar"
                     style="width: 80%;">
                    80%
                </div>

            </div>


            <h5>Python</h5>

            <div class="progress mb-4">

                <div class="progress-bar"
                     style="width: 75%;">
                    75%
                </div>

            </div>


            <h5>Database</h5>

            <div class="progress mb-4">

                <div class="progress-bar"
                     style="width: 85%;">
                    85%
                </div>

            </div>


            <h5>Web Designing</h5>

            <div class="progress">

                <div class="progress-bar"
                     style="width: 72%;">
                    72%
                </div>

            </div>

        </div>

    </div>

</section>


<footer class="bg-dark text-white text-center py-4">

    © 2026 CampusConnect

</footer>

</body>
</html>
